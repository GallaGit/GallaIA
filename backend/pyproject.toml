[project]
name = "gallaai-backend"
version = "0.1.0"
description = "GallaAI backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]",
    "pydantic-settings",
    "sqlalchemy>=2.0",
    "psycopg[binary]",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"