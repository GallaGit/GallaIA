[project]
name = "gallaai-backend"
version = "0.2.0"
description = "GallaAI AgentOS control plane API"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]==0.143.0",
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.1.4",
    "psycopg[binary]==3.3.6",
    "PyYAML==6.0.3",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*"]
